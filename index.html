<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЗІГ ЗАГ — Меню</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@300;400;500&display=block" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0d0d0d;
    --black2: #181818;
    --black3: #222222;
    --red: #cc1f1f;
    --red-dark: #8f1010;
    --red-light: #e63232;
    --cream: #f0e8dc;
    --gray: #aaa;
    --gray2: #555;
    --border: #2e2e2e;
  }

  html, body {
    background: var(--black);
    color: var(--cream);
    font-family: 'Oswald', sans-serif;
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }

  .header {
    position: relative;
    background: var(--black);
    padding: 32px 20px 24px;
    text-align: center;
    border-bottom: 2px solid var(--red);
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      -45deg, transparent, transparent 18px,
      rgba(204,31,31,0.04) 18px, rgba(204,31,31,0.04) 19px
    );
    pointer-events: none;
  }

  .logo {
    font-family: 'Black Ops One', sans-serif;
    font-size: clamp(42px, 13vw, 60px);
    font-style: normal;
    color: #fff;
    letter-spacing: 4px;
    line-height: 1;
    text-shadow: 3px 3px 0 var(--red-dark), 6px 6px 0 rgba(0,0,0,0.5);
  }
  .logo span { color: var(--red); }

  .tagline {
    font-family: 'Oswald', sans-serif;
    font-weight: 300;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--gray2);
    margin-top: 8px;
    text-transform: uppercase;
  }
  .insta {
    font-size: 12px;
    color: var(--gray2);
    margin-top: 4px;
    letter-spacing: 1px;
  }
  .insta span { color: #888; }

  .divider-line {
    display: flex; align-items: center; gap: 10px;
    margin: 12px auto 0; max-width: 260px;
  }
  .divider-line::before, .divider-line::after {
    content: ''; flex: 1; height: 1px; background: var(--red-dark);
  }
  .divider-line span { color: var(--red); font-size: 13px; }

  /* CATEGORY BAR */
  .cat-bar {
    display: flex; gap: 0;
    overflow-x: auto; scrollbar-width: none;
    background: var(--black2);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  .cat-bar::-webkit-scrollbar { display: none; }

  .cat-btn {
    flex-shrink: 0;
    padding: 12px 16px;
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    font-family: 'Oswald', sans-serif;
    font-weight: 400;
    font-size: 12px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--gray);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .cat-btn:hover { color: var(--cream); background: var(--black3); }
  .cat-btn.active { color: var(--red-light); border-bottom-color: var(--red); background: var(--black3); }

  /* MENU BODY */
  .menu-body { padding: 18px 14px 30px; max-width: 480px; margin: 0 auto; }

  .section-title {
    font-family: 'Black Ops One', sans-serif;
    font-style: normal;
    font-size: 20px;
    color: var(--red);
    letter-spacing: 2px;
    margin-bottom: 14px;
    margin-top: 4px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--red-dark); opacity: 0.5; }

  /* SUBSECTION */
  .subsection-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gray2);
    border-left: 2px solid var(--red-dark);
    padding-left: 8px;
    margin: 18px 0 10px;
  }

  /* ITEM CARD */
  .item-card {
    background: var(--black2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--red-dark);
    border-radius: 4px;
    padding: 13px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    transition: border-left-color 0.2s, background 0.2s;
  }
  .item-card:active { border-left-color: var(--red-light); background: var(--black3); }

  .item-info { flex: 1; min-width: 0; }

  .item-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 15px;
    color: var(--cream);
    letter-spacing: 0.3px;
    margin-bottom: 3px;
    line-height: 1.3;
  }
  .item-desc {
    font-family: 'Oswald', sans-serif;
    font-weight: 300;
    font-size: 12px;
    color: var(--gray);
    line-height: 1.5;
  }
  .item-weight {
    font-family: 'Oswald', sans-serif;
    font-weight: 300;
    font-size: 11px;
    color: var(--gray2);
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  .item-price {
    font-family: 'Black Ops One', sans-serif;
    font-style: normal;
    font-size: 16px;
    color: var(--red-light);
    white-space: nowrap;
    padding-top: 1px;
    flex-shrink: 0;
  }

  /* ALLERGY NOTE */
  .allergy-note {
    text-align: center;
    padding: 14px 16px;
    font-family: 'Oswald', sans-serif;
    font-weight: 300;
    font-size: 12px;
    color: var(--gray2);
    letter-spacing: 0.5px;
    border-top: 1px solid var(--border);
    font-style: italic;
    max-width: 480px;
    margin: 0 auto;
  }

  /* FOOTER */
  .footer {
    text-align: center;
    padding: 18px 20px 34px;
    border-top: 1px solid var(--border);
    max-width: 480px;
    margin: 0 auto;
  }
  .footer-logo { font-family: 'Black Ops One', sans-serif; font-style: normal; font-size: 16px; color: var(--gray2); letter-spacing: 3px; margin-bottom: 5px; }
  .footer-text { font-family: 'Oswald', sans-serif; font-weight: 300; font-size: 11px; letter-spacing: 1.5px; color: var(--gray2); text-transform: uppercase; }
  .footer-road { margin-top: 12px; font-size: 18px; opacity: 0.12; letter-spacing: 4px; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .item-card { animation: fadeUp 0.22s ease both; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">ЗІГ <span>ЗАГ</span></div>
  <div class="divider-line"><span>✦</span></div>
  <div class="tagline">Меню закладу</div>
  <div class="insta"><span>@zig_zag_kp</span></div>
</div>

<div class="cat-bar" id="catBar"></div>
<div class="menu-body" id="menuBody"></div>

<div class="allergy-note">
  Якщо у вас алергія на певний продукт з меню,<br>попередьте, будь ласка, нас завчасно
</div>

<div class="footer">
  <div class="footer-logo">ЗІГ ЗАГ</div>

  <div class="footer-road">— — — — —</div>
</div>

          { name: "З креветками", desc: "лист салату, рукола, креветки, авокадо, помідори, кунжут чорний, соус теріякі, салатна заправка", weight: "250 г", price: "185 ₴" },

          { name: "Салат з капусти", desc: "капуста білокачанна, морква, зелень, цибуля", weight: "150 г", price: "60 ₴" },

          { name: "Український байкер", desc: "яйце куряче, бекон, печериці смажені, огірок солоний, майонезна заправка", weight: "250 г", price: "100 ₴" },
          { name: "З буряком та фетою", desc: "рукола, мигдальні пластівці, соус медово-гірчичний", weight: "200 г", price: "85 ₴" },
        ]
      }
    ]
  },
  "Перші": {
    subsections: [
      {
        title: "Перші страви",
        items: [
          { name: "Борщ Український", desc: "із свининою та сметаною", weight: "350/20 г", price: "75 ₴" },
          { name: "Бограч Закарпатський", desc: "", weight: "350 г", price: "110 ₴" },

          { name: "Солянка збірна", desc: "", weight: "350 г", price: "95 ₴" },
          { name: "Гарбузовий крем-суп", desc: "з хлібними тостами та пармезаном", weight: "350/30 г", price: "75 ₴" },

      {
        title: "Гарніри",

          { name: "Картопля по-селянськи з часниковим соусом", desc: "", weight: "200/30 г", price: "68 ₴" },
          { name: "Картопля під сирним соусом", desc: "", weight: "200/100 г", price: "80 ₴" },

          { name: "Картопляне пюре з вершковим маслом", desc: "", weight: "200 г", price: "55 ₴" },

  "Закуски": {

      { name: "Брускета асорті", desc: "чіабатта, крем сир, прошуто, в'ялені томати, соус песто", weight: "2 шт.", price: "90 ₴" },
      { name: "Овочева нарізка", desc: "огірок, помідор, перець солодкий, зелень", weight: "300 г", price: "85 ₴" },
      { name: "Козацька закуска", desc: "сало, солоний огірок, гірчиця, часник, грінки", weight: "250 г", price: "130 ₴" },
      { name: "Закуска до пива", desc: "цибулеві кільця, кальмар, грінки, соус", weight: "300 г", price: "185 ₴" },
      { name: "Канапки під горілку", desc: "бородинський хліб, оселедець, цибуля", weight: "2 шт.", price: "50 ₴" },
      { name: "Antipasto", desc: "прошуто, салямі, дорблю, камамбер, в'ялені томати, маслини", weight: "300 г", price: "230 ₴" },
      { name: "Сирна тарілка", desc: "Грана падано, фета, камамбер, моцарелла, мед, грецький горіх, мигдальні пластівці", weight: "280/30 г", price: "230 ₴" },
      { name: "Паштет курячий з вишневим джемом та тостами", desc: "", weight: "250/80 г", price: "125 ₴" },

const cats = Object.keys(menu);
let active = cats[0];

const catBar = document.getElementById('catBar');
const menuBody = document.getElementById('menuBody');

function renderCats() {
  catBar.innerHTML = '';
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (cat === active ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => { active = cat; renderCats(); renderItems(); };
    catBar.appendChild(btn);
  });
}

function renderItem(item, i) {
  return `
    <div class="item-card" style="animation-delay:${i * 0.035}s">
      <div class="item-info">
        <div class="item-name">${item.name}</div>
        ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
        ${item.weight ? `<div class="item-weight">${item.weight}</div>` : ''}
      </div>
      <div class="item-price">${item.price}</div>
    </div>`;
}

function renderItems() {
  const section = menu[active];
  let html = '';
  let counter = 0;

  if (section.items) {
    html += `<div class="section-title">${active}</div>`;
    section.items.forEach(item => {
      html += renderItem(item, counter++);
    });
  } else if (section.subsections) {
    section.subsections.forEach((sub, si) => {
      if (si === 0) html += `<div class="section-title">${sub.title}</div>`;
      else html += `<div class="subsection-title">${sub.title}</div>`;
      sub.items.forEach(item => {
        html += renderItem(item, counter++);
      });
    });
  }

  menuBody.innerHTML = html;
}

renderCats();
renderItems();
</script>
</body>
</html>
